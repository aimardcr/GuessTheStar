name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y sshpass

      - name: Deploy over SSH
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          sudo apt-get install -y git
          
          if [ -z "$SSH_PASSWORD" ]; then
            echo "SSH_PASSWORD secret is missing" >&2
            exit 1
          fi

          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p 3022 72481-4905@gate.infra.dewacloud.com <<'EOF'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -y
          cd /root/GuessTheStar
          git fetch --all
          git reset --hard origin/main
          chmod +x setup.sh && chmod +x start.sh
          ./setup.sh
          sudo systemctl daemon-reload
          sudo systemctl restart guessthestar
          EOF